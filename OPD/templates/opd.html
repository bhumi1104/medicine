<!DOCTYPE html>
 <html>
     <head> 
        <title>OPD Queue Management</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
        </head> 
        <body> 
            <div class="container mt-5"> <h2>📝 OPD Queue</h2>
                 <form method="post" class="mt-4"> 
                    <div class="mb-3"> <label for="name" class="form-label">Patient Name</label> <input type="text" class="form-control" name="name" required> </div> 
                    <div class="mb-3"> <label for="age" class="form-label">Age</label> <input type="number" class="form-control" name="age" required> </div>
                     <div class="mb-3"> <label for="severity" class="form-label">Severity</label> <select name="severity" class="form-select"> 
                        <option value="Low">Low</option> 
                        <option value="Medium">Medium</option> 
                        <option value="High">High</option>
                     </select> 
                    </div>
                     <button type="submit" class="btn btn-primary">Add to Queue</button> 
                    </form>
                </div> 
            </body>
             </html>
