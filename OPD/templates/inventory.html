<!DOCTYPE html> <html> <head> <title>Inventory Management</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> </head> <body> <div class="container mt-5"> <h2>💊 Inventory</h2> <form method="post" class="mt-3"> <div class="mb-3"> <label for="item" class="form-label">Item Name</label> <input type="text" class="form-control" name="item" required> </div> <div class="mb-3"> <label for="quantity" class="form-label">Quantity</label> <input type="number" class="form-control" name="quantity" required> </div> <button type="submit" class="btn btn-warning">Add to Inventory</button> </form>
    <hr>
<h4>Current Stock</h4>
<ul class="list-group">
    {% for item in inventory %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ item.name }} — {{ item.quantity }} units
    </li>
    {% endfor %}
</ul>
</div> </body> </html>
