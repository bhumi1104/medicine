<!DOCTYPE html> <html> <head> <title>Patient Admission</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> </head> <body> <div class="container mt-5"> <h2>🏥 Patient Admission</h2> <form method="post" class="mt-3"> <div class="mb-3"> <label for="patient_id" class="form-label">Patient ID</label> <input type="text" class="form-control" name="patient_id" required> </div> <div class="mb-3"> <label for="bed_type" class="form-label">Bed Type</label> <select name="bed_type" class="form-select"> <option value="ICU">ICU</option> <option value="General">General</option> <option value="Emergency">Emergency</option> </select> </div> <button type="submit" class="btn btn-success">Admit Patient</button> </form> </div> </body> </html>
