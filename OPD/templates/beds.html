<!DOCTYPE html>
 <html> 
    <head>
         <title>Bed Availability</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
        </head> 
        <body>
             <div class="container mt-5"> <h2>🛏️ Bed Availability</h2> 
                <table class="table table-bordered mt-3"> <thead class="table-light"> 
                    <tr>
                         <th>Bed ID</th>
                          <th>Type</th>
                           <th>Status</th>
                         </tr>
                         </thead>
                          <tbody> {% for bed in beds %} <tr>
                             <td>{{ bed.id }}</td>
                              <td>{{ bed.type }}</td> 
                              <td>{{ bed.status }}</td>
                             </tr> {% endfor %} </tbody> 
                            </table> 
                        </div>
                     </body>
                      </html>
